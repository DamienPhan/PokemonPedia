<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infos du Pokémon</title>
    <link rel="stylesheet" href="../css/info.css">
</head>
<body class="theme--dark">
    <div class="container">
        <h1>Informations sur le Pokémon</h1>
        
        <!-- Conteneur pour afficher les informations du Pokémon recherché -->
        <div id="pokemon-details"></div>

        <!-- Conteneur pour afficher les teammates du Pokémon -->
        <section id="pokemon-teammates">
            <h3>Teammates</h3>
            <ul>
                <!-- Les teammates seront insérés ici dynamiquement -->
            </ul>
        </section>

        <!-- Conteneur pour le graphique des Tera Types -->
        <section class="pokemon-tera-types-chart">
            <h3>Tera Types Chart</h3>
            <canvas id="teraTypesChart" width="400" height="400"></canvas>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/info.js"></script>
</body>
</html>
