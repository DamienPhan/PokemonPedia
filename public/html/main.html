<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Search</title>
    <link rel="stylesheet" href="../css/main.css"> <!-- Référence au fichier CSS -->
</head>
<body class="theme--dark">
    <div class="container">
        <h1>Pokemon Search</h1>
        <!-- Barre de recherche pour Pokémon -->
        <input type="text" id="search-bar" placeholder="Enter Pokemon name" oninput="searchPokemon()" autocomplete="off">
        <ul id="suggestions"></ul> <!-- Liste pour afficher les suggestions -->
    </div>

    <script src="app.js"></script>
</body>
</html>
