<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Search</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- Référence au fichier CSS -->
</head>
<body class="theme--dark">
    <div class="container">
        <h1>Recherche de Pokémon</h1>
        <input type="text" id="search-bar" placeholder="Entrez le nom d'un Pokémon" oninput="searchPokemon()" autocomplete="off">
        <ul id="suggestions"></ul> <!-- Liste pour afficher les suggestions -->
        <div id="pokemon-details"></div> <!-- Section pour afficher les détails du Pokémon -->
    </div>

    <script src="../js/main.js"></script> <!-- Référence au fichier JS -->
</body>
</html>
